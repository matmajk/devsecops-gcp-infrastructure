# -----------------------------------------------------------------------------
# Kubernetes prerequisites
# -----------------------------------------------------------------------------

- name: Create JFrog namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ jfrog_namespace }}"

- name: Create JFrog master key Kubernetes Secret
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ jfrog_master_key_k8s_secret }}"
        namespace: "{{ jfrog_namespace }}"
      type: Opaque
      stringData:
        master-key: "{{ jfrog_master_key }}"
  no_log: true

- name: Create JFrog join key Kubernetes Secret
  kubernetes.core.k8s:
    state: present
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ jfrog_join_key_k8s_secret }}"
        namespace: "{{ jfrog_namespace }}"
      type: Opaque
      stringData:
        join-key: "{{ jfrog_join_key }}"
  no_log: true
